[package]
name = "pv"
version = "0.2.2"
edition = "2024"
description = "View the markdown file in `~/.claude/plans/` with the given command. By default, it opens the most recent file."

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
skim = { version = "4.7", default-features = false }
jiff = "0.2"
colored = "3.0"
dirs = "6.0"
shlex = "2.0"
walkdir = "2.5"
